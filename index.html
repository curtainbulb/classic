<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Hall — A Collection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --ivory:#e9e7e1; --ivory2:#e0ded5; --plaster:#dcdace;
  --ink:#232321; --ink-dim:#5c5a52;
  --walnut:#2e2b26; --walnut2:#1a1815;
  --gilt:#6f6a52; --gilt-bright:#8c8468; --gilt-line: rgba(111,106,82,.3);
  --velvet:#6e1f29; --velvet-bright:#9c2f3b; --velvet-dim:#4e151e;
  --hairline: rgba(35,35,33,.16);
  --shadow0: 0 1px 2px rgba(20,18,16,.08);
  --shadow1: 0 3px 10px rgba(20,18,16,.16);
  --shadow2: 0 10px 28px rgba(20,18,16,.3);
  color-scheme: light dark;
}
:root:not([data-theme="light"]){ }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ivory:#171614; --ivory2:#1d1c19; --plaster:#201f1b;
    --ink:#e2e0d8; --ink-dim:#a9a69b;
    --gilt:#9a927a; --gilt-bright:#b7ae8e; --gilt-line: rgba(154,146,122,.35);
    --velvet:#b03e49; --velvet-bright:#cf5560; --velvet-dim:#8a2e38;
    --hairline: rgba(226,224,216,.14);
    --shadow0: 0 1px 2px rgba(0,0,0,.4); --shadow1: 0 3px 10px rgba(0,0,0,.5); --shadow2: 0 10px 28px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --ivory:#171614; --ivory2:#1d1c19; --plaster:#201f1b;
  --ink:#e2e0d8; --ink-dim:#a9a69b;
  --gilt:#9a927a; --gilt-bright:#b7ae8e; --gilt-line: rgba(154,146,122,.35);
  --velvet:#b03e49; --velvet-bright:#cf5560; --velvet-dim:#8a2e38;
  --hairline: rgba(226,224,216,.14);
  --shadow0: 0 1px 2px rgba(0,0,0,.4); --shadow1: 0 3px 10px rgba(0,0,0,.5); --shadow2: 0 10px 28px rgba(0,0,0,.6);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--ivory); color:var(--ink);
  font-family:'Spectral', Georgia, 'Times New Roman', serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--walnut2);z-index:50;}
.chrome{ font-family:'Cormorant Garamond', Georgia, serif; letter-spacing:.14em; text-transform:uppercase; }

/* ===== PROSCENIUM HEADER ===== */
.proscenium{
  background: linear-gradient(180deg, var(--walnut2), var(--walnut));
  color: var(--ivory); padding:22px 20px 16px; position:relative;
  border-bottom:3px solid var(--velvet);
  box-shadow: var(--shadow2);
}
.proscenium::after{
  content:""; position:absolute; left:0; right:0; bottom:-6px; height:3px;
  background: repeating-linear-gradient(90deg, var(--velvet) 0 10px, transparent 10px 16px);
  opacity:.55;
}
.proscenium h1{ margin:0; font-size:26px; font-weight:500; }
.proscenium .sub{ margin-top:4px; font-size:12px; color:#b7a98f; letter-spacing:.12em; }
.stat-rail{ display:flex; gap:18px; margin-top:16px; flex-wrap:wrap; }
.stat-rail .s{ font-size:11px; color:#a69c87; }
.stat-rail .s b{ display:block; font-family:'Cormorant Garamond',serif; font-size:20px; color:var(--velvet-bright); font-weight:600; }

/* ===== STALLS (controls, base layer) ===== */
.stalls{ background:var(--plaster); border-bottom:1px solid var(--hairline); padding:14px 20px; position:sticky; top:0; z-index:20; box-shadow:var(--shadow0);}
.row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
input[type=text], select{
  font-family:'Spectral',serif; font-size:14px; background:var(--ivory2); color:var(--ink);
  border:1px solid var(--hairline); border-radius:2px; padding:8px 10px;
}
input[type=text]{ flex:1; min-width:160px; }
select.chrome{ font-size:11px; padding:8px 8px; }
.toggle-group{ display:flex; border:1px solid var(--gilt-line); border-radius:2px; overflow:hidden; }
.toggle-group button{
  font-family:'Cormorant Garamond',serif; letter-spacing:.1em; text-transform:uppercase; font-size:11px;
  background:transparent; color:var(--ink-dim); border:none; padding:8px 12px; cursor:pointer;
  border-right:1px solid var(--gilt-line);
}
.toggle-group button:last-child{ border-right:none; }
.toggle-group button.active{ background:var(--velvet); color:var(--ivory); font-weight:600; }
button.linklike{ background:none;border:none;color:var(--velvet-bright);font-family:inherit;cursor:pointer;text-decoration:underline;font-size:12px;padding:0; }

/* ===== PARTERRE (list of works, elevated tier) ===== */
.parterre{ padding:4px 0 60px; }
.era-tier{ padding:10px 20px 2px; position:sticky; top:62px; background:var(--ivory); z-index:10; border-bottom:1px solid var(--gilt-line); }
.era-tier h2{ margin:0; font-size:13px; font-weight:600; color:var(--velvet-bright); }
.work-row{
  display:grid; grid-template-columns: 34px 1fr auto; gap:12px; align-items:start;
  padding:14px 20px; border-bottom:1px solid var(--hairline); background:var(--ivory);
  transition: background .12s ease-out;
}
.work-row:hover{ background:var(--ivory2); }
.work-row.owned{ border-left:3px solid var(--velvet); }
.work-row.wanted{ border-left:3px solid var(--gilt-line); }
.seal{ width:30px;height:30px;border-radius:50%;border:1.5px solid var(--gilt-line); display:flex;align-items:center;justify-content:center;
  cursor:pointer; background:var(--ivory2); font-size:14px; color:var(--ink-dim); user-select:none; }
.seal.on{ background:var(--velvet); color:var(--ivory); box-shadow:0 0 0 2px var(--velvet-dim); }
.w-main .composer{ font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-dim); font-family:'Cormorant Garamond',serif;}
.w-main .title{ font-size:16px; margin:2px 0 4px; }
.w-main .dur{ font-size:11px; color:var(--ink-dim); }
.w-main .best{ font-size:13px; margin-top:6px; }
.w-main .best b{ color:var(--velvet-bright); font-weight:600; }
.alts{ font-size:12px; color:var(--ink-dim); margin-top:3px; }
.stars{ display:flex; gap:2px; cursor:pointer; margin-top:8px; }
.stars span{ color:var(--hairline); font-size:15px; }
.stars span.on{ color:var(--velvet-bright); }
textarea.notes{
  width:100%; margin-top:8px; font-family:'Spectral',serif; font-size:12px; background:var(--ivory2);
  border:1px solid var(--hairline); color:var(--ink); border-radius:2px; padding:6px; resize:vertical; min-height:34px;
}
.links{ display:flex; gap:8px; margin-top:8px; flex-wrap:wrap;}
.links a{ font-size:11px; color:var(--ivory); background:var(--walnut); padding:4px 8px; border-radius:2px; text-decoration:none; letter-spacing:.05em; border:1px solid var(--gilt-line); }
.w-right{ text-align:right; min-width:90px;}
.empty{ padding:60px 20px; text-align:center; color:var(--ink-dim); font-style:italic; }

/* ===== GALLERY (floating/temporary layer — modal) ===== */
.gallery-overlay{ position:fixed; inset:0; background:rgba(20,15,10,.55); display:none; align-items:flex-end; justify-content:center; z-index:40; }
.gallery-overlay.open{ display:flex; }
.gallery-card{
  background:var(--plaster); width:min(480px,94vw); margin-bottom:4vh; border-radius:4px 4px 2px 2px;
  box-shadow:var(--shadow2); border-top:3px solid var(--velvet); padding:18px; max-height:80vh; overflow:auto;
  animation: rise .18s ease-out;
}
@keyframes rise{ from{ transform:translateY(16px); opacity:0;} to{ transform:translateY(0); opacity:1;} }
.gallery-card h3{ margin:0 0 10px; font-size:14px; color:var(--velvet-bright); }
.gallery-card label{ display:block; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-dim); margin:10px 0 4px;}
.gallery-row{ display:flex; justify-content:flex-end; gap:10px; margin-top:14px;}
button.btn{
  font-family:'Cormorant Garamond',serif; text-transform:uppercase; letter-spacing:.1em; font-size:12px;
  background:var(--velvet); color:var(--ivory); border:none; padding:8px 16px; border-radius:2px; cursor:pointer; font-weight:600;
}
button.btn.ghost{ background:transparent; border:1px solid var(--gilt-line); color:var(--ink); }
.foot-rail{ position:fixed; bottom:0; left:0; right:0; background:var(--walnut2); color:#a69c87; font-size:11px; padding:8px 16px; display:flex; gap:14px; justify-content:center; letter-spacing:.08em; padding-bottom:calc(8px + env(safe-area-inset-bottom,0px)); z-index:30; }
.foot-rail button{ background:none; border:none; color:#a69c87; font-family:'Cormorant Garamond',serif; letter-spacing:.1em; text-transform:uppercase; font-size:11px; cursor:pointer; text-decoration:underline; }
</style>
</head>
<body>
<div class="proscenium">
  <div class="chrome sub">The Hall — Register of Recordings</div>
  <h1>Your Collection</h1>
  <div class="stat-rail" id="statRail"></div>
</div>

<div class="stalls">
  <div class="row">
    <input type="text" id="q" placeholder="Search composer, work, performer…">
    <select id="eraSel" class="chrome"></select>
    <select id="sortSel" class="chrome">
      <option value="era">Sort: Programme order</option>
      <option value="composer">Sort: Composer</option>
      <option value="title">Sort: Title</option>
      <option value="rating">Sort: Your rating</option>
    </select>
  </div>
  <div class="row" style="margin-top:10px;">
    <div class="toggle-group" id="statusFilter">
      <button data-v="all" class="active">All</button>
      <button data-v="owned">Seated</button>
      <button data-v="wanted">Waiting list</button>
    </div>
    <button class="linklike" id="exportJson">Export JSON</button>
    <button class="linklike" id="exportCsv">Export CSV</button>
  </div>
</div>

<div class="parterre" id="list"></div>

<div class="gallery-overlay" id="overlay">
  <div class="gallery-card" id="galleryCard"></div>
</div>

<div class="foot-rail">
  <span id="footCount"></span>
  <button id="resetBtn">Reset my marks</button>
</div>

p. 58","duration":"Complete, ~1.5 hrs","owned":false,"best":"Karl Böhm / Staatskapelle Dresden","alts":["Georg Solti / Vienna Philharmonic","Christoph von Dohnányi / Vienna Philharmonic"]},{"era":"OPERA","composer":"Benjamin Britten","work":"The Turn of the Screw, Op. 54","duration":"Complete, ~1.5 hrs","owned":false,"best":"Benjamin Britten / English Opera Group Orchestra","alts":["Colin Davis / London Symphony Orchestra","Steuart Bedford / English Chamber Orchestra"]},{"era":"OPERA","composer":"Leoš Janáček","work":"The Cunning Little Vixen","duration":"Complete, ~2 hrs","owned":false,"best":"Charles Mackerras / Vienna Philharmonic","alts":["Jiří Bělohlávek / Czech Philharmonic","Simon Rattle / City of Birmingham Symphony"]}]

</script>
<script>
(function(){
"use strict";
const RAW = JSON.parse(document.getElementById('data').textContent);
const KEY = 'hall_marks_v1';
let marks = {};
try{ marks = JSON.parse(localStorage.getItem(KEY) || '{}'); }catch(e){ marks = {}; }

function idOf(w,i){ return w.era+'::'+w.composer+'::'+w.work+'::'+i; }

const works = RAW.map((w,i)=>{
  const id = idOf(w,i);
  const mark = marks[id] || {};
  return Object.assign({id, idx:i}, w, {
    owned: (mark.owned !== undefined) ? mark.owned : w.owned,
    rating: mark.rating || 0,
    notes: mark.notes || ''
  });
});

function saveMark(id, patch){
  marks[id] = Object.assign({}, marks[id]||{}, patch);
  try{ localStorage.setItem(KEY, JSON.stringify(marks)); }catch(e){}
}

const eraOrder = [];
works.forEach(w=>{ if(!eraOrder.includes(w.era)) eraOrder.push(w.era); });

const eraSel = document.getElementById('eraSel');
eraSel.innerHTML = '<option value="">All sections</option>' + eraOrder.map(e=>`<option value="${e}">${e}</option>`).join('');

const q = document.getElementById('q');
const sortSel = document.getElementById('sortSel');
const statusBtns = document.querySelectorAll('#statusFilter button');
let statusFilter = 'all';

statusBtns.forEach(b=>b.addEventListener('click',()=>{
  statusBtns.forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); statusFilter = b.dataset.v; render();
}));
q.addEventListener('input', render);
eraSel.addEventListener('change', render);
sortSel.addEventListener('change', render);

function searchLink(service, w){
  const term = encodeURIComponent(w.composer + ' ' + w.work.split(',')[0]);
  if(service==='apple') return `https://music.apple.com/search?term=${term}`;
  if(service==='spotify') return `https://open.spotify.com/search/${term}`;
  if(service==='yt') return `https://www.youtube.com/results?search_query=${term}`;
}

function starsHtml(w){
  let h='<div class="stars" data-id="'+w.id+'">';
  for(let i=1;i<=5;i++) h += `<span data-n="${i}" class="${i<=w.rating?'on':''}">★</span>`;
  h += '</div>';
  return h;
}

function rowHtml(w){
  const statusClass = w.owned ? 'owned':'wanted';
  return `
  <div class="work-row ${statusClass}" data-id="${w.id}">
    <div class="seal ${w.owned?'on':''}" data-id="${w.id}" title="${w.owned?'In the collection':'Not yet in the collection'}">${w.owned?'✓':'○'}</div>
    <div class="w-main">
      <div class="composer">${w.composer||'—'}</div>
      <div class="title">${w.work}</div>
      <div class="dur">${w.duration||''} · ${w.era}</div>
      ${w.best?`<div class="best"><b>Best:</b> ${w.best}</div>`:''}
      ${w.alts&&w.alts.length?`<div class="alts">Alt: ${w.alts.join('; ')}</div>`:''}
      ${starsHtml(w)}
      <textarea class="notes" data-id="${w.id}" placeholder="Notes…">${w.notes}</textarea>
      <div class="links">
        <a href="${searchLink('apple',w)}" target="_blank" rel="noopener">Apple Music</a>
        <a href="${searchLink('spotify',w)}" target="_blank" rel="noopener">Spotify</a>
        <a href="${searchLink('yt',w)}" target="_blank" rel="noopener">YouTube</a>
      </div>
    </div>
    <div class="w-right chrome" style="font-size:10px;color:var(--ink-dim);">${w.owned?'Seated':'Waiting list'}</div>
  </div>`;
}

function render(){
  const term = q.value.trim().toLowerCase();
  const era = eraSel.value;
  let list = works.filter(w=>{
    if(statusFilter==='owned' && !w.owned) return false;
    if(statusFilter==='wanted' && w.owned) return false;
    if(era && w.era!==era) return false;
    if(term){
      const hay = (w.composer+' '+w.work+' '+w.best+' '+(w.alts||[]).join(' ')).toLowerCase();
      if(!hay.includes(term)) return false;
    }
    return true;
  });

  const sv = sortSel.value;
  if(sv==='composer') list.sort((a,b)=>a.composer.localeCompare(b.composer));
  else if(sv==='title') list.sort((a,b)=>a.work.localeCompare(b.work));
  else if(sv==='rating') list.sort((a,b)=>b.rating-a.rating);
  else list.sort((a,b)=>a.idx-b.idx);

  const listEl = document.getElementById('list');
  if(!list.length){ listEl.innerHTML = '<div class="empty">No recordings match. The house is quiet.</div>'; }
  else {
    let html=''; let curEra=null;
    list.forEach(w=>{
      if(sv==='era' && w.era!==curEra){ curEra=w.era; html+=`<div class="era-tier"><h2 class="chrome">${curEra}</h2></div>`; }
      html += rowHtml(w);
    });
    listEl.innerHTML = html;
  }

  listEl.querySelectorAll('.seal').forEach(s=>s.addEventListener('click',()=>{
    const w = works.find(x=>x.id===s.dataset.id);
    w.owned = !w.owned; saveMark(w.id,{owned:w.owned}); render(); renderStats();
  }));
  listEl.querySelectorAll('.stars').forEach(group=>{
    group.querySelectorAll('span').forEach(sp=>sp.addEventListener('click',()=>{
      const w = works.find(x=>x.id===group.dataset.id);
      const n = parseInt(sp.dataset.n,10);
      w.rating = (w.rating===n)? 0 : n;
      saveMark(w.id,{rating:w.rating}); render();
    }));
  });
  listEl.querySelectorAll('.notes').forEach(ta=>ta.addEventListener('change',()=>{
    const w = works.find(x=>x.id===ta.dataset.id);
    w.notes = ta.value; saveMark(w.id,{notes:w.notes});
  }));

  document.getElementById('footCount').textContent = `${list.length} of ${works.length} recordings shown`;
}

function renderStats(){
  const total = works.length;
  const owned = works.filter(w=>w.owned).length;
  const pct = total? Math.round(owned/total*100):0;
  const rated = works.filter(w=>w.rating>0).length;
  document.getElementById('statRail').innerHTML = `
    <div class="s"><b>${owned}</b>Seated</div>
    <div class="s"><b>${total-owned}</b>Waiting list</div>
    <div class="s"><b>${pct}%</b>Collection complete</div>
    <div class="s"><b>${rated}</b>Rated</div>
    <div class="s"><b>${eraOrder.length}</b>Programme sections</div>
  `;
}

function download(filename, content, type){
  const blob = new Blob([content], {type});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
}

document.getElementById('exportJson').addEventListener('click',()=>{
  download('collection.json', JSON.stringify(works.map(({idx,id,...rest})=>rest),null,2), 'application/json');
});
document.getElementById('exportCsv').addEventListener('click',()=>{
  const rows = [['Era','Composer','Work','Duration','Owned','Rating','Best','Alts','Notes']];
  works.forEach(w=>rows.push([w.era,w.composer,w.work,w.duration,w.owned,w.rating,w.best,(w.alts||[]).join(' | '),w.notes]));
  const csv = rows.map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\n');
  download('collection.csv', csv, 'text/csv');
});
document.getElementById('resetBtn').addEventListener('click',()=>{
  try{
    if(confirm('Clear all your marks (owned flips, ratings, notes) in this browser? This cannot be undone.')){
      localStorage.removeItem(KEY); location.reload();
    }
  }catch(e){}
});

render(); renderStats();
})();
</script>
</body>
</html>
