<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Classical Codex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DESIGN DERIVATION — Victorian concert-programme / engraved
   library codex. Double-rule borders, corner fleurons, drop
   caps, diamond dividers. Ornament marks structure, never fills
   emptiness. Palette extends the original print-codex tones;
   no new typefaces, no gothic/blackletter costume.
   ============================================================ */
:root,
:root[data-theme="light"],
:root[data-theme="dark"] {
  /* Single dark register only — per brief: "as dark as possible," no light mode.
     Derivation: tooled morocco-leather bookbinding + brass fittings + gaslight,
     not parchment/paper. Ground is leather-umber, never pure #000. */
  color-scheme: dark;
  --void:        #0A0806;
  --surface:     #120D09;
  --surface-raised: #19130D;
  --surface-hi:  #221A11;
  --border:      #352717;
  --border-hi:   #6B4E2E;
  --shadow:      none;
  --divider:     #2E2214;
  --text-primary:   #E8DCC4;
  --text-secondary: #B5A078;
  --text-dim:       #786547;
  --text-inverse:   #0A0806;
  --accent-primary:   #A8303A;
  --accent-secondary: #C9962E;
  --accent-tertiary:  #4A6B5C;
  --accent-forge:     #4A6B5C;
  --accent-gilt:      #D9AE4E;
  --accent-critical:  #C0414C;
  --accent-primary-dim:   rgba(168,48,58,.16);
  --accent-secondary-dim: rgba(201,150,46,.14);
  --accent-tertiary-dim:  rgba(74,107,92,.16);
  --accent-forge-dim:     rgba(74,107,92,.16);
  --accent-critical-dim:  rgba(192,65,76,.16);
}
:root {
  --chrome: 'Cormorant Garamond', 'Iowan Old Style', Georgia, serif;
  --body: 'Source Serif 4', Georgia, 'Times New Roman', serif;
  --radius: 0;
  --ease: ease-out;
  --dur-fast: 90ms;
  --dur: 140ms;
  --dur-slow: 160ms;

  --sp-1: clamp(4px,1vw,4px); --sp-2: clamp(6px,1.5vw,8px); --sp-3: clamp(8px,2vw,12px);
  --sp-4: clamp(10px,2.5vw,16px); --sp-5: clamp(14px,3vw,24px); --sp-6: clamp(18px,4vw,32px);
  --t-xs: clamp(10px,1.4vw,11px); --t-sm: clamp(11px,1.6vw,13px); --t-md: clamp(13px,1.8vw,14px);
  --t-body: clamp(14px,2vw,16px); --t-title: clamp(17px,2.4vw,20px); --t-lg: clamp(19px,3vw,25px);
  --t-disp: clamp(26px,4.5vw,40px);
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--void);
  color: var(--text-primary);
  font: var(--t-body)/1.6 var(--body);
  -webkit-font-smoothing: antialiased;
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; padding: 0; }
button:disabled { cursor: default; opacity: .4; }
button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--accent-tertiary); outline-offset: 2px;
}
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

#app { max-width: 820px; margin: 0 auto; padding: var(--sp-6) var(--sp-4) 72px; }

/* ---- engraved frame: double-rule border with corner fleurons ---- */
.engraved-frame {
  position: relative;
  border: 1px solid var(--border-hi);
  padding: var(--sp-5) var(--sp-5);
  margin-bottom: var(--sp-5);
}
.engraved-frame::before {
  content: '';
  position: absolute; inset: 5px;
  border: 1px solid var(--border-hi);
  pointer-events: none;
}
.fleuron {
  position: absolute; width: 16px; height: 16px;
  color: var(--accent-gilt); font: var(--t-md) var(--chrome);
  display: flex; align-items: center; justify-content: center;
  pointer-events: none; opacity: .85;
}
.fleuron.tl { top: -1px; left: -1px; }
.fleuron.tr { top: -1px; right: -1px; }
.fleuron.bl { bottom: -1px; left: -1px; }
.fleuron.br { bottom: -1px; right: -1px; }

/* ---- masthead ---- */
header.top {
  display: flex; align-items: flex-end; gap: var(--sp-4); flex-wrap: wrap;
  position: relative;
}
.logo {
  margin: 0; font: 600 var(--t-disp) var(--chrome); letter-spacing: .01em;
  color: var(--text-primary); font-variant: small-caps;
}
.logo .dinkus { color: var(--accent-gilt); margin-right: var(--sp-2); font-size: .7em; }
.spacer { flex: 1; }
.counter-pill {
  font: 600 var(--t-sm) var(--chrome); color: var(--text-secondary);
  padding-bottom: 6px; letter-spacing: .02em;
}
.counter-pill b { color: var(--accent-secondary); font-weight: 700; }
.icon-btn {
  min-width: 44px; min-height: 36px; padding: 0 var(--sp-3);
  border: 1px solid var(--border-hi); color: var(--text-secondary);
  display: inline-flex; align-items: center; gap: 6px;
  font: 600 var(--t-sm) var(--chrome);
  transition: color var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
}
.icon-btn:hover { color: var(--accent-primary); border-color: var(--accent-primary); }
.icon-btn[aria-pressed="true"] { background: var(--text-primary); color: var(--surface); border-color: var(--text-primary); }
.icon-btn.gilt:hover { color: var(--accent-gilt); border-color: var(--accent-gilt); }

/* ---- diamond divider ---- */
.diamond-rule {
  display: flex; align-items: center; gap: var(--sp-3);
  margin: var(--sp-2) 0 var(--sp-4); color: var(--border-hi);
}
.diamond-rule::before, .diamond-rule::after { content: ''; flex: 1; height: 1px; background: var(--divider); }
.diamond-rule span { font-size: 10px; transform: rotate(45deg); display: inline-block; border: 1px solid var(--border-hi); width: 7px; height: 7px; }

/* ---- toolbar ---- */
.toolbar { margin-bottom: var(--sp-3); display: flex; gap: var(--sp-3); align-items: center; flex-wrap: wrap; }
.toolbar .search-wrap { flex: 1 1 220px; position: relative; }
.toolbar input[type="search"] {
  width: 100%; background: transparent; border: none; border-bottom: 1px solid var(--border-hi);
  color: var(--text-primary); font: italic var(--t-body) var(--body);
  padding: var(--sp-2) 0; transition: border-color var(--dur-fast) var(--ease);
}
.toolbar input[type="search"]::placeholder { color: var(--text-dim); }
.toolbar input[type="search"]:focus { outline: none; border-color: var(--accent-primary); }
.sort-select {
  background: transparent; border: none; border-bottom: 1px solid var(--border-hi);
  color: var(--text-secondary); font: 600 var(--t-sm) var(--chrome); padding: var(--sp-2) var(--sp-1);
  letter-spacing: .02em;
}
.sort-select:focus { outline: none; border-color: var(--accent-primary); }

/* ---- filter rows ---- */
.chiprow { display: flex; gap: var(--sp-4); flex-wrap: wrap; margin-bottom: var(--sp-3); padding-bottom: var(--sp-2); }
.chiprow + .chiprow { margin-top: -4px; border-bottom: 1px solid var(--divider); margin-bottom: var(--sp-5); }
.chip {
  font: 600 var(--t-sm) var(--chrome); letter-spacing: .03em; text-transform: uppercase;
  color: var(--text-dim); padding-bottom: 4px; border-bottom: 2px solid transparent;
  transition: color var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease);
}
.chip:hover { color: var(--text-secondary); }
.chip.active { color: var(--accent-primary); border-color: var(--accent-primary); }
.chip.status-owned.active { color: var(--accent-secondary); border-color: var(--accent-secondary); }
.chip .count { color: var(--text-dim); font-weight: 500; }

/* ---- source picker (multi-file) ---- */
.source-row { display: flex; gap: var(--sp-2); flex-wrap: wrap; align-items: center; margin-bottom: var(--sp-3); }
.source-row .label { font: 600 var(--t-xs) var(--chrome); letter-spacing: .04em; text-transform: uppercase; color: var(--text-dim); }
.source-chip {
  font: 600 var(--t-xs) var(--chrome); padding: 3px 8px; border: 1px solid var(--border-hi);
  color: var(--text-secondary); letter-spacing: .02em;
  transition: color var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
}
.source-chip.active { background: var(--accent-forge-dim); color: var(--accent-forge); border-color: var(--accent-forge); }
.source-chip .fmt { color: var(--text-dim); font-style: italic; font-weight: 500; margin-left: 4px; }

/* ---- banner ---- */
.state-banner {
  border: 1px solid var(--border-hi); padding: var(--sp-3) var(--sp-4);
  margin-bottom: var(--sp-5); display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap;
  font: italic var(--t-sm) var(--body); color: var(--text-secondary);
}
.state-banner.error { color: var(--accent-critical); border-color: var(--accent-critical); }
.state-banner.notice { color: var(--accent-forge); border-color: var(--accent-forge); }
.state-banner button { color: var(--accent-tertiary); font-weight: 600; text-decoration: underline; flex: none; }

/* ---- skeleton ---- */
.skeleton-section { margin-bottom: var(--sp-6); }
.skeleton-head { width: 220px; height: 14px; background: var(--border); margin-bottom: var(--sp-3); animation: pulse 1.5s ease-in-out infinite; }
.skeleton-row { height: 56px; border-bottom: 1px solid var(--divider); background: var(--surface-raised); margin-bottom: var(--sp-2); animation: pulse 1.5s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .5; } }

/* ---- stats panel ---- */
.stats-panel {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: var(--sp-4);
  margin-bottom: var(--sp-5); padding: var(--sp-4) var(--sp-5); border: 1px solid var(--divider);
}
.stat { text-align: center; }
.stat .num { display: block; font: 600 var(--t-lg) var(--chrome); color: var(--accent-primary); }
.stat .lbl { font: 600 var(--t-xs) var(--chrome); letter-spacing: .04em; text-transform: uppercase; color: var(--text-dim); }

/* ---- era section ---- */
.era-section { margin-bottom: var(--sp-6); opacity: 0; animation: era-in var(--dur-slow) var(--ease) forwards; }
@keyframes era-in { from { opacity: 0; } to { opacity: 1; } }
.era-head {
  display: flex; align-items: baseline; gap: var(--sp-3); margin-bottom: var(--sp-3); flex-wrap: wrap;
  border-bottom: 1px solid var(--divider); padding-bottom: var(--sp-2);
}
.era-head h2 { margin: 0; font: 600 var(--t-lg) var(--chrome); color: var(--text-primary); }
.era-head h2::before { content: '❧'; color: var(--accent-primary); margin-right: var(--sp-2); font-size: .8em; }
.era-dates { font: italic var(--t-sm) var(--body); color: var(--text-dim); }
.era-progress { font: 600 var(--t-xs) var(--chrome); letter-spacing: .03em; color: var(--text-secondary); margin-left: auto; }

/* ---- drop cap on first composer strip of each era ---- */
.composer-strip.drop .composer-name::first-letter {
  font-size: 2.1em; color: var(--accent-primary); font-weight: 700;
  float: left; line-height: .78; margin-right: 2px;
}

/* ---- work list / composer portraits ---- */
.work-list { display: flex; flex-direction: column; }
.composer-strip {
  display: flex; align-items: center; gap: var(--sp-3); margin: var(--sp-4) 0 var(--sp-2);
}
.composer-strip:first-child { margin-top: 0; }
.portrait {
  flex: none; width: 40px; height: 40px; border: 1px solid var(--border-hi);
  background: var(--surface-raised); position: relative; overflow: hidden;
}
.portrait img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity var(--dur-slow) var(--ease); }
.portrait img.loaded { opacity: 1; }
.portrait .monogram {
  position: absolute; inset: 0; display: grid; place-items: center;
  font: 600 15px var(--chrome); color: var(--accent-tertiary); background: var(--accent-tertiary-dim);
}
.composer-name { font: 600 var(--t-title) var(--chrome); color: var(--text-primary); font-variant: small-caps; letter-spacing: .02em; }

.work-card {
  padding: var(--sp-3) 0; border-bottom: 1px solid var(--divider);
  opacity: 0; animation: card-in var(--dur-slow) var(--ease) forwards;
  display: flex; gap: var(--sp-3); align-items: flex-start;
}
@keyframes card-in { from { opacity: 0; } to { opacity: 1; } }
.work-card .bulk-check {
  flex: none; width: 16px; height: 16px; margin-top: 8px;
  border: 1px solid var(--border-hi); background: var(--surface);
  display: none; align-items: center; justify-content: center;
}
.bulk-mode .work-card .bulk-check { display: flex; }
.work-card .bulk-check.checked { background: var(--accent-forge-dim); border-color: var(--accent-forge); }
.work-card .bulk-check.checked::after { content: '✓'; color: var(--accent-forge); font-size: 11px; font-weight: 700; }
.work-card-body { flex: 1; min-width: 0; }
.work-top { display: flex; align-items: flex-start; gap: var(--sp-3); }
.status-dot { flex: none; width: 9px; height: 9px; margin-top: 7px; }
.status-dot.owned { background: var(--accent-secondary); }
.status-dot.wanted { background: var(--text-dim); }
.work-main { flex: 1; min-width: 0; }
.work-title { margin: 0; font: var(--t-body) var(--body); color: var(--text-primary); line-height: 1.4; }
.work-title mark { background: var(--accent-gilt); color: var(--text-primary); padding: 0 1px; }
.work-meta { font: italic var(--t-xs) var(--body); color: var(--text-dim); margin-top: 2px; }
.expand-btn {
  flex: none; font: var(--t-sm) var(--chrome); color: var(--text-dim);
  padding: 2px 4px; transition: transform var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}
.expand-btn:hover { color: var(--accent-primary); }
.work-card.open .expand-btn { transform: rotate(180deg); color: var(--accent-primary); }

.recordings { max-height: 0; overflow: hidden; transition: max-height var(--dur-slow) linear; }
.work-card.open .recordings { max-height: 320px; }
.recordings-inner { padding: var(--sp-2) 0 var(--sp-1) 21px; display: flex; flex-direction: column; gap: var(--sp-1); }
.recording-row { display: flex; gap: var(--sp-2); align-items: baseline; font-size: var(--t-sm); }
.recording-tag {
  flex: none; font: 600 var(--t-xs) var(--chrome); letter-spacing: .04em; text-transform: uppercase;
  color: var(--accent-primary);
}
.recording-row.alt .recording-tag { color: var(--text-dim); }
.recording-text { color: var(--text-secondary); font-style: italic; }

.recordings-inner .mini-portrait {
  width: 22px; height: 22px; flex: none; border: 1px solid var(--border-hi); overflow: hidden; position: relative;
}
.recordings-inner .mini-portrait img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity var(--dur-slow) var(--ease); }
.recordings-inner .mini-portrait img.loaded { opacity: 1; }
.recordings-inner .mini-portrait .monogram { position: absolute; inset: 0; display: grid; place-items: center; font: 600 10px var(--chrome); color: var(--accent-tertiary); background: var(--accent-tertiary-dim); }

.empty-state { text-align: center; padding: 56px 20px; color: var(--text-secondary); }
.empty-state .mark { font: 600 var(--t-disp) var(--chrome); color: var(--accent-primary); margin-bottom: var(--sp-3); }
.empty-state p { font-style: italic; }
.empty-state button {
  margin-top: var(--sp-3); display: inline-flex; min-height: 40px; padding: 0 var(--sp-4); align-items: center;
  border: 1px solid var(--text-primary); color: var(--text-primary);
  font: 600 var(--t-sm) var(--chrome); letter-spacing: .02em;
}
.empty-state button:hover { background: var(--text-primary); color: var(--surface); }

/* ---- bulk action bar ---- */
.bulk-bar {
  position: sticky; bottom: 0; display: none; gap: var(--sp-3); align-items: center;
  background: var(--surface-raised); border: 1px solid var(--border-hi); padding: var(--sp-3) var(--sp-4);
  margin-top: var(--sp-4);
}
.bulk-mode .bulk-bar { display: flex; flex-wrap: wrap; }
.bulk-bar .count { font: 600 var(--t-sm) var(--chrome); color: var(--text-secondary); }
.bulk-bar button {
  border: 1px solid var(--border-hi); padding: 4px 10px; font: 600 var(--t-xs) var(--chrome);
  letter-spacing: .02em; color: var(--text-secondary);
}
.bulk-bar button:hover:not(:disabled) { color: var(--accent-forge); border-color: var(--accent-forge); }

.hidden { display: none !important; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
}
</style>
</head>
<body>
<div id="app">
  <div class="engraved-frame">
    <span class="fleuron tl">❦</span><span class="fleuron tr">❦</span>
    <span class="fleuron bl">❦</span><span class="fleuron br">❦</span>
    <header class="top">
      <h1 class="logo"><span class="dinkus">❧</span>Classical Codex</h1>
      <div class="spacer"></div>
      <span class="counter-pill" id="counterPill" aria-live="polite"></span>
      <button class="icon-btn" id="statsBtn" aria-pressed="false" title="Toggle statistics">⌗ Stats</button>
      <button class="icon-btn" id="bulkBtn" aria-pressed="false" title="Toggle bulk-select mode">☑ Select</button>
      <button class="icon-btn gilt" id="exportBtn" title="Export owned list as Markdown">⤓ Export</button>
      <button class="icon-btn" id="reloadBtn" aria-label="Reload manifest" title="Reload">↺ Reload</button>
    </header>
  </div>

  <div id="sourceRow"></div>

  <div class="toolbar">
    <div class="search-wrap">
      <input type="search" id="searchInput" placeholder="Search composer or work…" aria-label="Search">
    </div>
    <select class="sort-select" id="sortSelect" aria-label="Sort order">
      <option value="era">Sort: Era order</option>
      <option value="composer">Sort: Composer A–Z</option>
      <option value="title">Sort: Title A–Z</option>
      <option value="duration-asc">Sort: Duration ↑</option>
      <option value="duration-desc">Sort: Duration ↓</option>
    </select>
  </div>

  <div class="chiprow" id="statusChips" role="group" aria-label="Filter by status"></div>
  <div class="chiprow" id="eraChips" role="group" aria-label="Filter by era"></div>

  <div id="banner"></div>
  <div id="statsPanel"></div>
  <div id="skeleton"></div>
  <main id="list" aria-live="polite"></main>

  <div class="bulk-bar" id="bulkBar">
    <span class="count" id="bulkCount">0 selected</span>
    <button id="bulkOwnBtn">Mark Owned</button>
    <button id="bulkWantBtn">Mark Wanted</button>
    <button id="bulkClearBtn">Clear selection</button>
  </div>
</div>

<script>
/* ============================================================
   CONFIG / CONSTANTS
   ============================================================ */
const KEY_CACHE = 'cc_cache_v2';
const KEY_PORTRAIT = 'cc_portrait_v2_';
const KEY_OVERRIDES = 'cc_overrides_v2'; // manual owned/wanted overrides keyed by work id
const KEY_SOURCE = 'cc_source_v2';       // last-selected source file
const PORTRAIT_TTL_MS = 30 * 24 * 60 * 60 * 1000;
const PORTRAIT_CONCURRENCY = 4;
const MANIFEST_NAMES_HINT = ['classical.md', 'manifest.md', 'collection.md', 'library.md', 'codex.md'];
const INDEX_FILE = 'manifest.json'; // optional sibling file: {"files":["a.md","b.md"]}

const state = {
  works: [],
  statusFilter: 'all',
  eraFilter: 'all',
  query: '',
  sort: 'era',
  openIds: new Set(),
  bulkMode: false,
  bulkSelected: new Set(),
  statsOpen: false,
  sources: [],       // [{name, format}]
  activeSource: null,
  overrides: {},     // id -> 'owned'|'wanted'
};
const portraitFailCache = new Set();

const els = {
  counterPill: document.getElementById('counterPill'),
  reloadBtn: document.getElementById('reloadBtn'),
  statsBtn: document.getElementById('statsBtn'),
  bulkBtn: document.getElementById('bulkBtn'),
  exportBtn: document.getElementById('exportBtn'),
  searchInput: document.getElementById('searchInput'),
  sortSelect: document.getElementById('sortSelect'),
  statusChips: document.getElementById('statusChips'),
  eraChips: document.getElementById('eraChips'),
  banner: document.getElementById('banner'),
  statsPanel: document.getElementById('statsPanel'),
  skeleton: document.getElementById('skeleton'),
  list: document.getElementById('list'),
  sourceRow: document.getElementById('sourceRow'),
  bulkBar: document.getElementById('bulkBar'),
  bulkCount: document.getElementById('bulkCount'),
};

/* ============================================================
   UTIL
   ============================================================ */
function lsGet(key, fallback) {
  try { const raw = localStorage.getItem(key); return raw === null ? fallback : JSON.parse(raw); }
  catch { return fallback; }
}
function lsSet(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
}
function slugify(s) {
  return String(s).toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function initials(name) {
  return String(name).split(/\s+/).filter(Boolean).map(w => w[0]).join('').slice(0, 3).toUpperCase();
}
function highlight(text, q) {
  if (!q) return escapeHtml(text);
  const idx = text.toLowerCase().indexOf(q.toLowerCase());
  if (idx === -1) return escapeHtml(text);
  return escapeHtml(text.slice(0, idx)) + '<mark>' + escapeHtml(text.slice(idx, idx + q.length)) + '</mark>' + escapeHtml(text.slice(idx + q.length));
}
function parseDurationMinutes(label) {
  if (!label) return null;
  // handles "~15 min", "~2.5 hrs", "~3 hrs", "~18–24 hrs depending on tempo" (takes first number)
  const hrMatch = label.match(/([\d.]+)\s*hr/i);
  if (hrMatch) return parseFloat(hrMatch[1]) * 60;
  const minMatch = label.match(/([\d.]+)\s*min/i);
  if (minMatch) return parseFloat(minMatch[1]);
  return null;
}

/* ============================================================
   DUAL-FORMAT MANIFEST PARSER
   Format A ("codex"): fixed taxonomy — ALL-CAPS or year-bearing
     header lines, "- [x]/[ ]/bare Composer – Work (meta)" entries,
     "Best:"/"Alt:" recording lines.
   Format B ("generic"): standard GFM — "#"/"##" headers, plain
     "- " or "* " bullets as work titles, optional nested "  - "
     sub-bullets treated as recording notes. No Best/Alt convention
     required; checkbox syntax still respected if present.
   detectFormat() sniffs the first ~40 non-empty lines.
   ============================================================ */
function detectFormat(raw) {
  const lines = raw.split(/\r\n|\r|\n/).map(l => l.trim()).filter(Boolean).slice(0, 60);
  let codexSignals = 0, genericSignals = 0;
  for (const line of lines) {
    if (/^Best:\s*/i.test(line) || /^Alt:\s*/i.test(line)) codexSignals += 2;
    if (/^-\s*\[[ x]\]\s*.+[–—].+\(.*\)/i.test(line)) codexSignals += 1;
    if (/^#{1,6}\s+/.test(line)) genericSignals += 2;
    if (/^[*+]\s+/.test(line)) genericSignals += 1;
  }
  return codexSignals >= genericSignals ? 'codex' : 'generic';
}

function parseManifestCodex(raw, sourceTag) {
  raw = raw.replace(/\r\n/g, '\n').replace(/\r/g, '\n').replace(/[\ue000-\uf8ff]/g, '');
  const lines = raw.split('\n');
  const works = [];
  let currentEra = { name: 'Uncategorized', id: 'uncategorized' };
  let pending = null;
  const flush = () => { if (pending) { works.push(pending); pending = null; } };

  for (const rawLine of lines) {
    const line = rawLine.trim();
    if (!line) continue;
    const checkedMatch = line.match(/^-\s*\[x\]\s*(.+)$/i);
    const uncheckedMatch = line.match(/^-\s*\[\s\]\s*(.+)$/);
    const bestMatch = line.match(/^Best:\s*(.+)$/i);
    const altMatch = line.match(/^Alt:\s*(.+)$/i);
    const bareWorkMatch = !checkedMatch && !uncheckedMatch && !bestMatch && !altMatch
      ? line.match(/^([^–—-]+(?:–|—)[^(]+\(.+\))$/)
      : null;
    const looksLikeHeader = !checkedMatch && !uncheckedMatch && !bestMatch && !altMatch && !bareWorkMatch
      && /^[A-Za-z0-9 ,.'’()\u2013\u2014-]+$/.test(line)
      && (line === line.toUpperCase() || /\(\d{4}/.test(line));

    if (looksLikeHeader) {
      flush();
      currentEra = { name: line.replace(/\s+/g, ' ').trim(), id: slugify(line) || 'era-' + works.length };
      continue;
    }
    if (checkedMatch || uncheckedMatch || bareWorkMatch) {
      flush();
      const body = (checkedMatch || uncheckedMatch || bareWorkMatch)[1].trim();
      const status = checkedMatch ? 'owned' : 'wanted';
      const dashSplit = body.split(/\s+[–—]\s+/);
      const composer = dashSplit.length >= 2 ? dashSplit[0].trim() : 'Unknown composer';
      let rest = dashSplit.length >= 2 ? dashSplit.slice(1).join(' \u2013 ').trim() : body;
      let durationLabel = null;
      const durMatch = rest.match(/\(([^()]*?(?:min|hr|hrs)[^()]*)\)\s*$/i);
      let work = rest;
      if (durMatch) { durationLabel = durMatch[1].trim(); work = rest.slice(0, durMatch.index).trim(); }
      pending = {
        id: slugify(sourceTag + '-' + currentEra.id + '-' + composer + '-' + work) || 'work-' + works.length,
        era: currentEra.name, eraId: currentEra.id,
        composer, work, durationLabel, status, recordings: [], source: sourceTag,
      };
      continue;
    }
    if (bestMatch && pending) { pending.recordings.push({ tag: 'Best', text: bestMatch[1].trim() }); continue; }
    if (altMatch && pending) {
      const parts = altMatch[1].split(';').map(s => s.trim()).filter(Boolean);
      for (const p of parts) pending.recordings.push({ tag: 'Alt', text: p });
      continue;
    }
  }
  flush();
  return works;
}

// Generic GFM parser: "# / ## Heading" => era; "- item" or "* item" => work
// (composer guessed from an em/en-dash split if present, else whole line is the title
// under "Unknown composer"); nested "  - sub" one level deeper => recording note,
// first such line tagged Best, rest tagged Alt. Checkbox syntax still honored.
function parseManifestGeneric(raw, sourceTag) {
  raw = raw.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  const lines = raw.split('\n');
  const works = [];
  let currentEra = { name: 'Uncategorized', id: 'uncategorized' };
  let pending = null;
  const flush = () => { if (pending) { works.push(pending); pending = null; } };

  for (const rawLine of lines) {
    if (!rawLine.trim()) continue;
    const indent = rawLine.match(/^(\s*)/)[1].length;
    const line = rawLine.trim();

    const headerMatch = line.match(/^#{1,6}\s+(.+)$/);
    if (headerMatch) {
      flush();
      currentEra = { name: headerMatch[1].trim(), id: slugify(headerMatch[1]) || 'era-' + works.length };
      continue;
    }

    const bulletMatch = line.match(/^[-*+]\s*(?:\[([ xX])\]\s*)?(.+)$/);
    if (bulletMatch && indent < 2) {
      flush();
      const checked = bulletMatch[1] && /x/i.test(bulletMatch[1]);
      const hasCheckbox = bulletMatch[1] !== undefined;
      const body = bulletMatch[2].trim();
      const status = hasCheckbox ? (checked ? 'owned' : 'wanted') : 'wanted';
      const dashSplit = body.split(/\s+[–—]\s+/);
      const composer = dashSplit.length >= 2 ? dashSplit[0].trim() : 'Unknown composer';
      let rest = dashSplit.length >= 2 ? dashSplit.slice(1).join(' \u2013 ').trim() : body;
      let durationLabel = null;
      const durMatch = rest.match(/\(([^()]*?(?:min|hr|hrs)[^()]*)\)\s*$/i);
      let work = rest;
      if (durMatch) { durationLabel = durMatch[1].trim(); work = rest.slice(0, durMatch.index).trim(); }
      else {
        // also accept trailing parens as generic metadata even without duration units
        const parenMatch = rest.match(/\(([^()]+)\)\s*$/);
        if (parenMatch) { durationLabel = parenMatch[1].trim(); work = rest.slice(0, parenMatch.index).trim(); }
      }
      pending = {
        id: slugify(sourceTag + '-' + currentEra.id + '-' + composer + '-' + work) || 'work-' + works.length,
        era: currentEra.name, eraId: currentEra.id,
        composer, work, durationLabel, status, recordings: [], source: sourceTag,
      };
      continue;
    }

    // nested bullet / indented line under a pending work = recording note
    if (pending && indent >= 2) {
      const subMatch = line.match(/^[-*+]?\s*(?:\[([ xX])\]\s*)?(.+)$/);
      const text = subMatch ? subMatch[2].trim() : line;
      const tag = pending.recordings.length === 0 ? 'Best' : 'Alt';
      if (text) pending.recordings.push({ tag, text });
      continue;
    }
  }
  flush();
  return works;
}

function parseManifest(raw, sourceTag) {
  const format = detectFormat(raw);
  const works = format === 'codex' ? parseManifestCodex(raw, sourceTag) : parseManifestGeneric(raw, sourceTag);
  return { works, format };
}

/* ============================================================
   OVERRIDES (manual owned/wanted toggles persisted locally;
   source files are never mutated — this is a client-side layer)
   ============================================================ */
function loadOverrides() { state.overrides = lsGet(KEY_OVERRIDES, {}); }
function saveOverrides() { lsSet(KEY_OVERRIDES, state.overrides); }
function applyOverrides(works) {
  return works.map(w => state.overrides[w.id] ? { ...w, status: state.overrides[w.id] } : w);
}
function setOverride(id, status) { state.overrides[id] = status; saveOverrides(); }

/* ============================================================
   FETCH + MULTI-FILE DISCOVERY
   Strategy, ranked:
   1. If hosted on *.github.io or a path matching a GitHub repo,
      use the GitHub Contents API (unauthenticated, rate-limited
      but no CORS issues) to list the directory and find *.md.
   2. Otherwise (or if (1) fails/rate-limits), look for an
      optional sibling "manifest.json" = {"files": ["a.md", ...]}
      that the user can maintain by hand on any static host.
   3. Fall back to probing the historical fixed filename
      "classical.md" so existing single-file setups keep working
      with zero migration.
   ============================================================ */
function githubRepoInfoFromLocation() {
  // username.github.io/reponame/... (project pages) or username.github.io/... (user page, repo = username.github.io)
  const host = location.hostname;
  const m = host.match(/^([^.]+)\.github\.io$/i);
  if (!m) return null;
  const owner = m[1];
  const parts = location.pathname.split('/').filter(Boolean);
  const repo = parts.length > 0 ? parts[0] : (owner + '.github.io');
  const dir = parts.length > 0 ? parts.slice(1, -1).join('/') : '';
  return { owner, repo, dir };
}

async function discoverViaGithubApi() {
  const info = githubRepoInfoFromLocation();
  if (!info) return null;
  const apiPath = `https://api.github.com/repos/${info.owner}/${info.repo}/contents/${info.dir}`;
  const r = await fetch(apiPath, { headers: { Accept: 'application/vnd.github+json' } });
  if (!r.ok) return null; // rate-limited or repo not public — fall through silently
  const list = await r.json();
  if (!Array.isArray(list)) return null;
  return list.filter(f => f.type === 'file' && /\.md$/i.test(f.name)).map(f => f.name);
}

async function discoverViaManifestJson() {
  try {
    const r = await fetch(INDEX_FILE + '?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return null;
    const data = await r.json();
    if (data && Array.isArray(data.files)) return data.files.filter(f => /\.md$/i.test(f));
    return null;
  } catch { return null; }
}

async function discoverViaProbe() {
  const found = [];
  for (const name of MANIFEST_NAMES_HINT) {
    try {
      const r = await fetch(name + '?t=' + Date.now(), { method: 'HEAD', cache: 'no-store' });
      if (r.ok) found.push(name);
    } catch {}
  }
  return found;
}

async function discoverManifestFiles() {
  if (location.protocol === 'file:') throw new Error('file-protocol');
  let files = await discoverViaGithubApi();
  if (files && files.length) return { files, method: 'github-api' };
  files = await discoverViaManifestJson();
  if (files && files.length) return { files, method: 'manifest-json' };
  files = await discoverViaProbe();
  if (files.length) return { files, method: 'probe' };
  throw new Error('no-manifests-found');
}

async function fetchText(url) {
  const busted = url + (url.includes('?') ? '&' : '?') + 't=' + Date.now();
  const r = await fetch(busted, { cache: 'no-store' });
  if (!r.ok) throw new Error('http-' + r.status);
  return await r.text();
}

async function loadAllManifests() {
  const { files, method } = await discoverManifestFiles();
  const results = [];
  for (const name of files) {
    try {
      const text = await fetchText(name);
      const { works, format } = parseManifest(text, slugify(name));
      results.push({ name, format, works, ok: true });
    } catch (err) {
      results.push({ name, ok: false, error: String(err && err.message || err) });
    }
  }
  return { results, method };
}

/* ============================================================
   REFRESH / LOAD
   ============================================================ */
async function refresh() {
  renderSkeleton();
  els.banner.innerHTML = '';
  try {
    const { results, method } = await loadAllManifests();
    clearSkeleton();
    const ok = results.filter(r => r.ok);
    if (!ok.length) throw new Error('no-manifests-parsed');

    state.sources = ok.map(r => ({ name: r.name, format: r.format }));
    const failed = results.filter(r => !r.ok);

    let active = lsGet(KEY_SOURCE, null);
    if (!active || !ok.some(r => r.name === active)) active = ok[0].name;
    state.activeSource = active;

    const cachePayload = {};
    for (const r of ok) cachePayload[r.name] = { works: r.works, format: r.format, ts: Date.now() };
    lsSet(KEY_CACHE, cachePayload);

    renderSourceRow();
    setWorksFromActiveSource();

    if (failed.length) {
      showBanner(`${failed.length} file(s) found but failed to parse: ${failed.map(f => f.name).join(', ')}.`, false, true);
    } else if (method === 'probe') {
      showBanner('Using filename probing (no manifest.json found) — add one to list files explicitly on non-GitHub hosts.', false, false, true);
    }
  } catch (err) {
    clearSkeleton();
    const cached = lsGet(KEY_CACHE, null);
    if (cached && Object.keys(cached).length) {
      state.sources = Object.keys(cached).map(name => ({ name, format: cached[name].format }));
      let active = lsGet(KEY_SOURCE, null);
      if (!active || !cached[active]) active = state.sources[0].name;
      state.activeSource = active;
      renderSourceRow();
      setWorksFromCache(cached);
      showBanner(`Live fetch failed — showing cached data. (${describeError(err)})`, false, true);
    } else {
      showBanner(describeError(err), true);
      els.list.innerHTML = '';
      els.counterPill.textContent = '';
      els.sourceRow.innerHTML = '';
    }
  }
}

function setWorksFromActiveSource() {
  const cache = lsGet(KEY_CACHE, {});
  setWorksFromCache(cache);
}
function setWorksFromCache(cache) {
  const entry = cache[state.activeSource];
  state.works = entry ? applyOverrides(entry.works) : [];
  renderStatusChips();
  renderEraChips();
  render();
}

function describeError(err) {
  const msg = String(err && err.message || err);
  if (msg === 'file-protocol') return 'Opened from disk (file://) — serve this folder over HTTP (e.g. python3 -m http.server) and open the localhost URL instead.';
  if (msg === 'no-manifests-found') return 'No .md manifest found. On GitHub Pages this uses the repo API automatically; on other hosts, add a "manifest.json" beside this file: {"files":["classical.md"]}.';
  if (msg === 'no-manifests-parsed') return 'Manifest file(s) were found but none could be parsed.';
  if (msg.startsWith('http-')) return `Request failed (status ${msg.replace('http-', '')}).`;
  return 'Could not load manifests: ' + msg;
}

function showBanner(msg, isError, isNotice) {
  if (!msg) { els.banner.innerHTML = ''; return; }
  const cls = isError ? 'error' : (isNotice ? 'notice' : '');
  els.banner.innerHTML = `<div class="state-banner ${cls}">${escapeHtml(msg)}<button id="bannerRetry">Retry</button></div>`;
  document.getElementById('bannerRetry').onclick = refresh;
}

/* ============================================================
   SOURCE ROW (multi-file switcher)
   ============================================================ */
function renderSourceRow() {
  if (state.sources.length <= 1) { els.sourceRow.innerHTML = ''; return; }
  const chips = state.sources.map(s =>
    `<button class="source-chip ${s.name === state.activeSource ? 'active' : ''}" data-name="${escapeHtml(s.name)}">${escapeHtml(s.name)}<span class="fmt">${s.format}</span></button>`
  ).join('');
  els.sourceRow.innerHTML = `<div class="source-row"><span class="label">Sources</span>${chips}</div>`;
  els.sourceRow.querySelectorAll('.source-chip').forEach(btn => {
    btn.onclick = () => {
      state.activeSource = btn.dataset.name;
      lsSet(KEY_SOURCE, state.activeSource);
      state.eraFilter = 'all'; state.statusFilter = 'all'; state.bulkSelected.clear();
      renderSourceRow();
      setWorksFromActiveSource();
    };
  });
}

/* ============================================================
   PORTRAITS (concurrency-capped)
   ============================================================ */
let portraitInFlight = 0;
const portraitQueue = [];
function enqueuePortrait(fn) {
  portraitQueue.push(fn);
  pumpPortraitQueue();
}
function pumpPortraitQueue() {
  while (portraitInFlight < PORTRAIT_CONCURRENCY && portraitQueue.length) {
    const fn = portraitQueue.shift();
    portraitInFlight++;
    fn().finally(() => { portraitInFlight--; pumpPortraitQueue(); });
  }
}

function portraitBoxHtml(composer, size) {
  const slug = slugify(composer);
  const cls = size === 'mini' ? 'mini-portrait' : 'portrait';
  return `<span class="${cls}" data-composer="${escapeHtml(composer)}" data-slug="${slug}">
    <span class="monogram">${escapeHtml(initials(composer))}</span>
  </span>`;
}

function resolvePortrait(composer) {
  return new Promise(resolve => {
    const slug = slugify(composer);
    const cacheKey = KEY_PORTRAIT + slug;
    const cached = lsGet(cacheKey, null);
    if (cached) {
      if (cached.url === null) return resolve(null);
      if (Date.now() - cached.ts < PORTRAIT_TTL_MS) return resolve(cached.url);
    }
    if (portraitFailCache.has(slug)) return resolve(null);

    enqueuePortrait(async () => {
      try {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 4000);
        const searchEndpoint = 'https://commons.wikimedia.org/w/api.php?action=query&generator=search' +
          '&gsrsearch=' + encodeURIComponent('intitle:' + composer + ' portrait') +
          '&gsrlimit=1&prop=imageinfo&iiprop=url&iiurlwidth=160&format=json&origin=*';
        const r = await fetch(searchEndpoint, { signal: controller.signal });
        clearTimeout(timeout);
        if (!r.ok) throw new Error('http-' + r.status);
        const data = await r.json();
        const pages = data && data.query && data.query.pages;
        let url = null;
        if (pages) {
          const first = Object.values(pages)[0];
          if (first && first.imageinfo && first.imageinfo[0]) url = first.imageinfo[0].thumburl || first.imageinfo[0].url || null;
        }
        lsSet(cacheKey, { url, ts: Date.now() });
        if (!url) portraitFailCache.add(slug);
        resolve(url);
      } catch {
        portraitFailCache.add(slug);
        lsSet(cacheKey, { url: null, ts: Date.now() });
        resolve(null);
      }
    });
  });
}

function hydratePortraits(root) {
  root.querySelectorAll('[data-composer]').forEach(box => {
    const composer = box.dataset.composer;
    resolvePortrait(composer).then(url => {
      if (!url) return;
      const img = document.createElement('img');
      img.alt = '';
      img.loading = 'lazy';
      img.onload = () => img.classList.add('loaded');
      img.onerror = () => img.remove();
      img.src = url;
      box.appendChild(img);
    });
  });
}

/* ============================================================
   DERIVED VIEWS / FILTER / SORT
   ============================================================ */
function eraOrder() {
  const seen = [];
  const set = new Set();
  for (const w of state.works) if (!set.has(w.eraId)) { set.add(w.eraId); seen.push({ id: w.eraId, name: w.era }); }
  return seen;
}

function filteredWorks() {
  const q = state.query.trim().toLowerCase();
  let list = state.works.filter(w => {
    if (state.statusFilter !== 'all' && w.status !== state.statusFilter) return false;
    if (state.eraFilter !== 'all' && w.eraId !== state.eraFilter) return false;
    if (q && !(w.composer.toLowerCase().includes(q) || w.work.toLowerCase().includes(q))) return false;
    return true;
  });
  const durVal = w => { const m = parseDurationMinutes(w.durationLabel); return m === null ? Infinity : m; };
  switch (state.sort) {
    case 'composer': list = list.slice().sort((a, b) => a.composer.localeCompare(b.composer) || a.work.localeCompare(b.work)); break;
    case 'title': list = list.slice().sort((a, b) => a.work.localeCompare(b.work)); break;
    case 'duration-asc': list = list.slice().sort((a, b) => durVal(a) - durVal(b)); break;
    case 'duration-desc': list = list.slice().sort((a, b) => durVal(b) - durVal(a)); break;
    default: break; // 'era' keeps manifest order
  }
  return list;
}

function updateCounter() {
  const owned = state.works.filter(w => w.status === 'owned').length;
  els.counterPill.innerHTML = `<b>${owned}</b> / ${state.works.length} owned`;
}

function renderStatusChips() {
  const owned = state.works.filter(w => w.status === 'owned').length;
  const wanted = state.works.length - owned;
  els.statusChips.innerHTML = [
    chip('All', state.works.length, 'all'),
    chip('Owned', owned, 'owned', 'status-owned'),
    chip('Wanted', wanted, 'wanted'),
  ].join('');
  els.statusChips.querySelectorAll('.chip').forEach(btn => {
    btn.onclick = () => { state.statusFilter = btn.dataset.val; render(); };
  });
}
function chip(label, count, val, extraClass) {
  const active = state.statusFilter === val;
  return `<button class="chip ${extraClass || ''} ${active ? 'active' : ''}" data-val="${val}">${escapeHtml(label)} <span class="count">${count}</span></button>`;
}

function renderEraChips() {
  const eras = eraOrder();
  const allBtn = `<button class="chip ${state.eraFilter === 'all' ? 'active' : ''}" data-era="all">All eras</button>`;
  const rest = eras.map(e => {
    const count = state.works.filter(w => w.eraId === e.id).length;
    return `<button class="chip ${state.eraFilter === e.id ? 'active' : ''}" data-era="${e.id}">${escapeHtml(e.name)} <span class="count">${count}</span></button>`;
  }).join('');
  els.eraChips.innerHTML = allBtn + rest;
  els.eraChips.querySelectorAll('.chip').forEach(btn => {
    btn.onclick = () => { state.eraFilter = btn.dataset.era; render(); };
  });
}

/* ============================================================
   STATS PANEL
   ============================================================ */
function renderStats() {
  if (!state.statsOpen) { els.statsPanel.innerHTML = ''; return; }
  const total = state.works.length;
  const owned = state.works.filter(w => w.status === 'owned').length;
  const composers = new Set(state.works.map(w => w.composer)).size;
  const eras = eraOrder().length;
  const totalMin = state.works.reduce((sum, w) => { const m = parseDurationMinutes(w.durationLabel); return sum + (m || 0); }, 0);
  const hrs = Math.round(totalMin / 60);
  els.statsPanel.innerHTML = `<div class="stats-panel">
    <div class="stat"><span class="num">${total}</span><span class="lbl">Works</span></div>
    <div class="stat"><span class="num">${owned}</span><span class="lbl">Owned</span></div>
    <div class="stat"><span class="num">${total ? Math.round(owned / total * 100) : 0}%</span><span class="lbl">Complete</span></div>
    <div class="stat"><span class="num">${composers}</span><span class="lbl">Composers</span></div>
    <div class="stat"><span class="num">${eras}</span><span class="lbl">Eras</span></div>
    <div class="stat"><span class="num">~${hrs}h</span><span class="lbl">Total runtime</span></div>
  </div>`;
}
els.statsBtn.onclick = () => {
  state.statsOpen = !state.statsOpen;
  els.statsBtn.setAttribute('aria-pressed', String(state.statsOpen));
  renderStats();
};

/* ============================================================
   BULK SELECT
   ============================================================ */
els.bulkBtn.onclick = () => {
  state.bulkMode = !state.bulkMode;
  document.getElementById('app').classList.toggle('bulk-mode', state.bulkMode);
  els.bulkBtn.setAttribute('aria-pressed', String(state.bulkMode));
  if (!state.bulkMode) state.bulkSelected.clear();
  updateBulkBar();
  render();
};
function updateBulkBar() {
  els.bulkCount.textContent = `${state.bulkSelected.size} selected`;
  const none = state.bulkSelected.size === 0;
  document.getElementById('bulkOwnBtn').disabled = none;
  document.getElementById('bulkWantBtn').disabled = none;
  document.getElementById('bulkClearBtn').disabled = none;
}
document.getElementById('bulkOwnBtn').onclick = () => { applyBulkStatus('owned'); };
document.getElementById('bulkWantBtn').onclick = () => { applyBulkStatus('wanted'); };
document.getElementById('bulkClearBtn').onclick = () => { state.bulkSelected.clear(); updateBulkBar(); render(); };
function applyBulkStatus(status) {
  for (const id of state.bulkSelected) {
    setOverride(id, status);
    const w = state.works.find(w => w.id === id);
    if (w) w.status = status;
  }
  state.bulkSelected.clear();
  updateBulkBar();
  renderStatusChips();
  render();
}

/* ============================================================
   EXPORT (owned list as Markdown, matching codex grammar)
   ============================================================ */
els.exportBtn.onclick = () => {
  const owned = state.works.filter(w => w.status === 'owned');
  if (!owned.length) { showBanner('No owned works to export yet.', false, true); return; }
  const byEra = {};
  for (const w of owned) { (byEra[w.era] ||= []).push(w); }
  let md = '';
  for (const eraName of Object.keys(byEra)) {
    md += `${eraName.toUpperCase()}\n\n`;
    for (const w of byEra[eraName]) {
      const dur = w.durationLabel ? ` (${w.durationLabel})` : '';
      md += `- [x] ${w.composer} – ${w.work}${dur}\n`;
      const best = w.recordings.find(r => r.tag === 'Best');
      const alts = w.recordings.filter(r => r.tag === 'Alt');
      if (best) md += ` Best: ${best.text}\n`;
      if (alts.length) md += ` Alt: ${alts.map(a => a.text).join('; ')}\n`;
      md += '\n';
    }
  }
  const blob = new Blob([md], { type: 'text/markdown' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `codex-owned-${slugify(state.activeSource || 'export')}.md`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(a.href);
};

/* ============================================================
   RENDER
   ============================================================ */
function render() {
  updateCounter();
  renderStats();
  const works = filteredWorks();
  if (!state.works.length) { els.list.innerHTML = ''; return; }
  if (!works.length) {
    els.list.innerHTML = `<div class="empty-state"><div class="mark">♩</div>
      <p>No works match this filter.</p>
      <button id="clearFiltersBtn">Clear filters</button></div>`;
    document.getElementById('clearFiltersBtn').onclick = () => {
      state.statusFilter = 'all'; state.eraFilter = 'all'; state.query = '';
      els.searchInput.value = '';
      renderStatusChips(); renderEraChips(); render();
    };
    return;
  }

  // When sorting by anything other than 'era', group under a single pseudo-era
  // so the composer-strip + drop-cap structure still reads cleanly.
  const groupedByEra = state.sort === 'era';
  const eras = groupedByEra ? eraOrder().filter(e => works.some(w => w.eraId === e.id)) : [{ id: '__all__', name: 'All Works' }];

  let html = '';
  let firstEra = true;
  for (const era of eras) {
    const eraWorks = groupedByEra ? works.filter(w => w.eraId === era.id) : works;
    const owned = eraWorks.filter(w => w.status === 'owned').length;
    html += `<section class="era-section">`;
    if (groupedByEra) {
      html += `<div class="era-head">
        <h2>${escapeHtml(era.name)}</h2>
        <span class="era-progress">${owned}/${eraWorks.length} OWNED</span>
      </div>`;
    }
    html += `<div class="work-list">`;
    let lastComposer = null;
    let firstComposerInEra = true;
    eraWorks.forEach((w, i) => {
      if (w.composer !== lastComposer) {
        const dropCls = (firstEra && firstComposerInEra) ? 'drop' : '';
        html += `<div class="composer-strip ${dropCls}">${portraitBoxHtml(w.composer, 'full')}<span class="composer-name">${escapeHtml(w.composer)}</span></div>`;
        lastComposer = w.composer;
        firstComposerInEra = false;
      }
      html += workCard(w, i);
    });
    html += `</div></section>`;
    firstEra = false;
  }
  els.list.innerHTML = html;

  els.list.querySelectorAll('.work-card').forEach(card => {
    card.querySelector('.expand-btn').onclick = () => {
      const id = card.dataset.id;
      if (state.openIds.has(id)) state.openIds.delete(id); else state.openIds.add(id);
      card.classList.toggle('open');
    };
    const check = card.querySelector('.bulk-check');
    if (check) {
      const toggle = () => {
        const id = card.dataset.id;
        if (state.bulkSelected.has(id)) state.bulkSelected.delete(id); else state.bulkSelected.add(id);
        check.classList.toggle('checked');
        check.setAttribute('aria-checked', state.bulkSelected.has(id) ? 'true' : 'false');
        updateBulkBar();
      };
      check.onclick = toggle;
      check.onkeydown = (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
      };
    }
  });
  hydratePortraits(els.list);
}

function workCard(w, i) {
  const open = state.openIds.has(w.id);
  const q = state.query.trim();
  const checked = state.bulkSelected.has(w.id);
  const recordings = w.recordings.map(r =>
    `<div class="recording-row ${r.tag === 'Alt' ? 'alt' : ''}">
       <span class="recording-tag">${escapeHtml(r.tag)}</span>
       ${portraitBoxHtml(w.composer, 'mini')}
       <span class="recording-text">${escapeHtml(r.text)}</span>
     </div>`).join('');
  return `<article class="work-card ${open ? 'open' : ''}" data-id="${w.id}" style="animation-delay:${Math.min(i * 20, 160)}ms">
    <span class="bulk-check ${checked ? 'checked' : ''}" role="checkbox" aria-checked="${checked}" tabindex="${state.bulkMode ? '0' : '-1'}"></span>
    <div class="work-card-body">
      <div class="work-top">
        <span class="status-dot ${w.status}" aria-hidden="true"></span>
        <div class="work-main">
          <h3 class="work-title">${highlight(w.work, q)}</h3>
          <div class="work-meta">${w.durationLabel ? escapeHtml(w.durationLabel) : ''}</div>
        </div>
        <button class="expand-btn" aria-label="Show recordings" aria-expanded="${open}">▼</button>
      </div>
      <div class="recordings"><div class="recordings-inner">${recordings || '<span class="recording-text">No recordings listed.</span>'}</div></div>
    </div>
  </article>`;
}

/* ============================================================
   SKELETON
   ============================================================ */
function renderSkeleton() {
  let html = '';
  for (let s = 0; s < 2; s++) {
    html += '<div class="skeleton-section"><div class="skeleton-head"></div>';
    for (let i = 0; i < 3; i++) html += '<div class="skeleton-row" style="animation-delay:' + (i * 60) + 'ms"></div>';
    html += '</div>';
  }
  els.skeleton.innerHTML = html;
}
function clearSkeleton() { els.skeleton.innerHTML = ''; }

/* ============================================================
   WIRE-UP + BOOT
   ============================================================ */
els.reloadBtn.onclick = refresh;
els.searchInput.addEventListener('input', () => { state.query = els.searchInput.value; render(); });
els.sortSelect.addEventListener('change', () => { state.sort = els.sortSelect.value; render(); });

loadOverrides();
refresh();
</script>
</body>
</html>
